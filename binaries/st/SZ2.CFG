# SZ2.CFG - settings for the Atari ST port of Cho Ren Sha 68k, read from
# beside the program when it starts.
#
# One name=value per line, in any case; true, 1, yes or on to enable,
# false, 0, no or off to disable. Lines starting with # or ; are ignored.
# Every line below is shown set to the OPPOSITE of its default, so
# uncommenting a line changes that setting. The default is named at the
# end of each description. A setting the game does not know, or a value
# it cannot read, is named on the start-up screen and ignored.

# --- preset -------------------------------------------------------

# One of:
#   default      the settings below, as they are set here (default)
#   performance  the most pictures per second: crop, the score in a band
#                of its own, no music
#   authentic    as close to the X68000 as it gets: full height, the
#                score over the playfield, music
# performance and authentic set screen, hud, megaste_speedup and music
# all at once, whatever this file says about them; the Mega STE runs at
# 16MHz with its cache in both.
#preset=authentic

# --- picture ------------------------------------------------------

# How the X68000's 256-line picture meets the ST's screen. One of:
#   crop  the 200-line screen: 200 lines of the playfield, a window that
#         follows the ship (F2 holds it still) (default)
#   full  open the top and bottom borders: 273 lines, the whole
#         playfield and no window. Costs about a fifth of the pictures
#         per second. If the borders do not open on the machine, the
#         game plays in crop instead
#screen=full

# Where the score goes. One of:
#   over  over the top of the playfield, as on the X68000 (default)
#   band  in a black band of its own above the playfield, which then
#         shows 8 lines fewer: about 6% more pictures per second (4%
#         on a Mega STE)
#hud=band

# --- machine ------------------------------------------------------

# Run a Mega STE at 16MHz with its cache on. false keeps it at 8MHz
# without the cache, an STE's speed - for comparisons, not for
# playing. (default: true)
#megaste_speedup=false

# --- sound --------------------------------------------------------

# The music: the game's songs, made from the X68000 originals, on the
# YM2149 (MUSIC_DAT). An STE or Mega STE plays the sound effects beside
# it with DMA sound; on an ST an effect takes one of the YM2149's three
# voices while it plays. false: no music, and on an ST the effects have
# the whole YM2149 again. (default: true)
#music=false

# --- testing ------------------------------------------------------

# Start in lockstep: every frame is drawn and the game slows down to the
# drawing speed (F1 switches it while playing). (default: false)
#lockstep=true

# Exit after this many frames (50 a second) of the attract demo, with a
# report of the timings: for measurements. (default: 0, never)
#frames=6000
